[project]
name = "unpaired-text-to-image"
version = "0.1.0"
description = "Text-to-image generation without annotated pairs (ECE MSc2 AI, Gen AI project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false
exclude-newer = "2026-11-10T00:00:00Z"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
